services:
  - type: web
    runtime: static
    name: owlheart
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Access-Control-Allow-Methods
        value: "GET, OPTIONS"
      - path: /*
        name: Access-Control-Allow-Headers
        value: "Content-Type"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
